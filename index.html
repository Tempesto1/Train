<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рабочие веса</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- pwa:start — только для версии-приложения, при сборке для claude.ai вырезается -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Веса">
<meta name="theme-color" content="#191C1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>window.STANDALONE=true;</script>
<style>:root{padding-top:var(--sat);padding-bottom:var(--sab)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<!-- pwa:end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scale.css">
<link rel="stylesheet" href="css/week.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/progress.css">
<!-- pwa:start -->
<style>body::before{background:#191C1F!important}</style>
<!-- pwa:end -->
</head>
<body>
<section class="view" id="scaleView" aria-label="Шкала недель">
  <header class="bar">
    <div><h1 class="logo">Рабочие веса</h1><span class="status" id="status">Загружаю…</span></div>
    <div class="bar-act">
      <button class="tbtn" data-act="profile" id="pfBtn" aria-label="Мои данные: вес и возраст">Мои данные</button>
      <button class="tbtn" data-go="progress"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><path d="M1 11 L5 6 L8 8 L13 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Прогресс</button>
    </div>
    <div class="scale-head" aria-hidden="true"><span>нед.</span><span>дни</span><span>что сделано</span></div>
  </header>
  <div id="notice"></div>
  <div id="scale"></div>
  <p class="scale-foot" id="scaleFoot"></p>
</section>

<section class="view" id="weekView" hidden aria-label="Неделя"></section>
<section class="view" id="progressView" hidden aria-label="Прогресс"></section>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Тренировка"></div>
<div class="ov" id="pf" hidden role="dialog" aria-modal="true" aria-labelledby="pfTitle"></div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
<!-- pwa:start -->
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
<!-- pwa:end -->
</body>
</html>
